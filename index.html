<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanvasDrop // Micro Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --accent: #6366f1;
      --accent-soft: #eef2ff;
      --accent-hover: #4f46e5;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      margin-bottom: 32px;
      text-align: left;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
      margin-bottom: 24px;
    }

    /* Drop Zone UI */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .dropzone svg {
      width: 36px;
      height: 36px;
      stroke: var(--accent);
      fill: none;
      margin-bottom: 8px;
    }

    .dropzone span {
      display: block;
      font-weight: 600;
      color: var(--text);
      font-size: 0.95rem;
    }

    .dropzone small {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* Editor View */
    .editor-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    textarea {
      width: 100%;
      height: 200px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text);
      background: #fafafa;
      outline: none;
      resize: vertical;
      transition: border 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--accent-hover); }

    /* Output Section */
    .output-section {
      display: none;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .url-bar {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .url-input {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f1f5f9;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">Static Serverless</div>
      <h1>Sub-Page Launcher</h1>
      <p class="subtitle">Convert standalone HTML files into instantly hostable URLs on your domain.</p>
    </header>

    <div class="card">
      <div class="dropzone" id="drop-zone">
        <svg xmlns="http://www.w3.org/2000/svg" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>
        <span>Click to browse or drop an HTML file here</span>
        <small>Supports single-file HTML pages with inline CSS and JS</small>
        <input type="file" id="file-input" accept=".html,.htm" style="display: none;">
      </div>

      <label class="editor-label">Raw HTML Code Preview</label>
      <textarea id="code-preview" placeholder="Upload a file or paste your code directly here..."></textarea>

      <button id="generate-btn" class="btn">Generate Hosted URL</button>

      <div class="output-section" id="output-section">
        <label class="editor-label">Hosted URL Fragment</label>
        <div class="url-bar">
          <input type="text" id="output-url" class="url-input" readonly>
          <button class="btn-secondary" id="copy-btn">Copy</button>
          <button class="btn-secondary" id="open-btn">Open</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

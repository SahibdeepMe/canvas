<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanvasDrop // Micro Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --accent: #6366f1;
      --accent-soft: #eef2ff;
      --accent-hover: #4f46e5;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      margin-bottom: 24px;
      text-align: left;
    }

    .badge {
      display: inline-flex;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      background: #fafafa;
    }

    input:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .dropzone:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    textarea {
      width: 100%;
      height: 180px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      background: #fafafa;
      outline: none;
      resize: vertical;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }

    .btn:hover { background: var(--accent-hover); }

    .output-section {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .url-bar {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">Direct Cloud Deploy</div>
      <h1>Sub-Page Launcher</h1>
      <p class="subtitle">Deploy custom-named HTML endpoints directly to your canvas repo.</p>
    </header>

    <div class="card">
      <div class="form-group">
        <label>GitHub Fine-Grained / Classic Token (Saved in LocalStorage)</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      </div>

      <div class="form-group">
        <label>Custom Short Path / Name</label>
        <input type="text" id="project-slug" placeholder="e.g. portfolio, my-tool, game">
      </div>

      <div class="dropzone" id="drop-zone">
        <strong>Click or drop HTML file here</strong>
        <input type="file" id="file-input" accept=".html,.htm" style="display: none;">
      </div>

      <label>Raw HTML Code</label>
      <textarea id="code-preview" placeholder="HTML code will appear here..."></textarea>

      <button id="publish-btn" class="btn">Deploy Custom Page</button>

      <div class="output-section" id="output-section">
        <label>Your Short Custom URL</label>
        <div class="url-bar">
          <input type="text" id="output-url" readonly>
          <button class="btn-secondary" id="copy-btn">Copy</button>
          <button class="btn-secondary" id="open-btn">Open</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

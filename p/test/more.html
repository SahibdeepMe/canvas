<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>More Movie Servers</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  color: white;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer; /* indicate clickable area */
}
video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(1.5) contrast(1.3);
  z-index: -1;
}
h1 { text-align: center; font-size: 2rem; margin-top: 30px; text-shadow: 2px 2px 10px black; }
.more-buttons {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 25px;
  width: 80%;
  margin: 50px auto;
  justify-items: center;
}
.more-buttons button {
  background: transparent;
  color: white;
  font-size: 18px;
  font-weight: bold;
  border: 5px solid;
  border-image: linear-gradient(45deg, #ff6600, #ffcc00) 1;
  border-radius: 14px;
  padding: 14px 0;
  width: 100%;
  transition: 0.3s ease;
  cursor: pointer;
}
.more-buttons button:hover {
  transform: scale(1.08);
  border-image: linear-gradient(45deg, #ffcc00, #ff6600) 1;
  box-shadow: 0 0 20px rgba(255, 165, 0, 0.7);
}
.back-btn {
  display: block;
  margin-bottom: 40px;
  padding: 12px 40px;
  font-size: 18px;
  background: rgba(0, 0, 0, 0.8);
  border: 4px solid;
  border-image: linear-gradient(45deg, #ff6600, #ffcc00) 1;
  border-radius: 10px;
  color: white;
  transition: 0.3s;
  cursor: pointer;
}
.back-btn:hover { background: linear-gradient(45deg, #ff6600, #ffcc00); color: black; }
</style>
</head>
<body>
  <!-- Background video -->
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="44.mp4" type="video/mp4" />
  </video>

  <h1></h1>

  <div class="more-buttons">
    <button class="big-btn" data-url="https://flixapp.in/">Flixapp</button>
    <button class="big-btn" data-url="https://vegamovies.cy/">Vega Movies</button>
    <button class="big-btn" data-url="https://4khdhub.fans/">4khdhub</button>
    <button class="big-btn" data-url="https://katmoviehd.pk/">Katmoviehd</button>
    <button class="big-btn" data-url="https://flixhq-tv.lol/home">Flixhq</button>
    <button class="big-btn" data-url="https://filmyfly.republican/">Filmy Fly</button>
    <button class="big-btn" data-url="https://uhdmovies.rip/">UHD Movies</button>
    <button class="big-btn" data-url="https://topmovies.pet/">Top Movies</button>
	<button class="big-btn" data-url="https://hdmovieverse.com/">Movie Verse</button>
    <button class="big-btn" data-url="https://moviesdrive.mom/">Moviezdrive</button>
  </div>

  <button class="back-btn" onclick="history.back()">← Back</button>

  <script>
    const video = document.getElementById('bgVideo');

    // Attempt autoplay (muted)
    video.play().catch(() => {});

    // Function to unmute video and play audio
    function enableAudio() {
      video.muted = false;
      video.volume = 1;
      video.play().catch(() => {});
    }

    // Add event listener on body click
    document.body.addEventListener('click', enableAudio, { once: true });

    // Also add to each button click
    document.querySelectorAll('.more-buttons .big-btn').forEach(btn => {
      btn.addEventListener('click', enableAudio);
      btn.addEventListener('click', () => {
        const url = btn.getAttribute('data-url');
        if(url) window.open(url, '_blank', 'noopener');
      });
    });
  </script>
</body>
</html>

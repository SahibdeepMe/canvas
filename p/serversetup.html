    let currentSlide = 0;

    function renderSlide(index) {
      const slide = slides[index];
      const container = document.getElementById('slideContent');
      container.innerHTML = slide.render();
      
      document.getElementById('currentSlideNum').textContent = index + 1;
      document.getElementById('totalSlidesNum').textContent = slides.length;
      document.getElementById('slideCategory').textContent = slide.category;
      document.getElementById('timeEst').textContent = slide.duration;

      // Update button states
      document.getElementById('prevBtn').disabled = (index === 0);
      document.getElementById('nextBtn').disabled = (index === slides.length - 1);

      // Refresh Lucide icons
      lucide.createIcons();
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function togglePresenterMode() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn(`Error attempting to enable fullscreen: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key.toLowerCase() === 'f') {
        togglePresenterMode();
      }
    });

    // Initial render
    document.addEventListener('DOMContentLoaded', () => {
      renderSlide(0);
    });
  </script>

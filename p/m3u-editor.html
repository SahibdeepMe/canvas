<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gentleman Downside</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 15px 20px;
            border-bottom: 2px solid #333;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .main-content {
            flex: 1;
            display: flex;
            height: calc(100vh - 80px);
        }

        .sidebar {
            width: 320px;
            background: #1a1a1a;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .search-box {
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        .search-box input {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .channel-item {
            padding: 12px;
            margin-bottom: 6px;
            background: #2d2d2d;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #444;
        }

        .channel-item:hover {
            background: #3d3d3d;
        }

        .channel-item.active {
            background: #06b6d4;
            border-color: #06b6d4;
        }

        .channel-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .channel-group {
            font-size: 12px;
            color: #888;
        }

        .channel-item.active .channel-group {
            color: #fff;
        }

        .player-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .video-container {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            max-height: 70vh;
        }

        .placeholder {
            color: #666;
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }

        .controls {
            padding: 15px;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            background: #06b6d4;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .btn:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .btn.ghost {
            background: transparent;
            border: 1px solid #444;
        }

        .btn.success {
            background: #22c55e;
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .toggle-switch {
            width: 40px;
            height: 20px;
            background: #444;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
        }

        .toggle-switch.active {
            background: #06b6d4;
        }

        .toggle-slider {
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.2s;
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(20px);
        }

        .audio-menu {
            position: relative;
        }

        .audio-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .audio-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            min-width: 120px;
            display: none;
            z-index: 1000;
        }

        .audio-dropdown.show {
            display: block;
        }

        .audio-option {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .audio-option:hover {
            background: #3d3d3d;
        }

        .status {
            font-size: 12px;
            color: #888;
            text-align: center;
        }

        .now-playing {
            flex: 1;
        }

        #currentChannel {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
        }

        .close-modal {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .m3u-editor {
            width: 100%;
            height: 400px;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            resize: vertical;
            white-space: pre;
            overflow: auto;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .copy-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #22c55e;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            z-index: 10001;
            display: none;
        }

        .copy-notification.show {
            display: block;
            animation: fadeOut 2s ease-in-out 1s forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: 200px;
                border-right: none;
                border-bottom: 1px solid #333;
            }
            
            .channel-list {
                height: 120px;
            }
            
            video {
                max-height: 50vh;
            }
            
            .control-row {
                flex-direction: column;
                align-items: stretch;
            }
            
            .control-group {
                justify-content: center;
            }

            .header {
                flex-direction: column;
                gap: 10px;
            }

            .header-buttons {
                width: 100%;
                justify-content: center;
            }
        }

        .loading {
            color: #06b6d4;
            font-style: italic;
        }

        .error {
            color: #ff4444;
        }

        .success {
            color: #44ff44;
        }

        .stream-info {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Gentleman Downside</div>
            <div class="header-buttons">
                <button class="btn ghost" id="editorBtn">M3U Editor</button>
                <button class="btn success" id="copyStreamBtn" disabled>Copy Stream URL</button>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search channels...">
                </div>
                <div class="channel-list" id="channelList">
                    <div class="placeholder">Loading channels...</div>
                </div>
            </div>

            <div class="player-area">
                <div class="video-container" id="videoContainer">
                    <video id="videoPlayer" controls style="display: none;"></video>
                    <div class="placeholder" id="placeholder">
                        Select a channel to start playing
                    </div>
                </div>

                <div class="controls">
                    <div class="control-row">
                        <div class="now-playing">
                            <div id="currentChannel">No channel selected</div>
                            <div class="status" id="playerStatus">Ready - Select a channel</div>
                            <div class="stream-info" id="streamInfo"></div>
                        </div>
                        <div class="control-group">
                            <button class="btn" id="externalBtn" disabled>Play External</button>
                            <button class="btn ghost" id="rawUrlBtn" disabled>Open URL</button>
                        </div>
                    </div>

                    <div class="control-row">
                        <div class="control-group">
                            <div class="toggle" id="incompatibleToggle">
                                <div class="toggle-switch">
                                    <div class="toggle-slider"></div>
                                </div>
                                <span>Compatible Mode</span>
                            </div>

                            <div class="audio-menu">
                                <button class="audio-btn" id="audioBtn">
                                    Audio: Auto ▾
                                </button>
                                <div class="audio-dropdown" id="audioDropdown">
                                    <div class="audio-option" data-lang="auto">Auto</div>
                                    <div class="audio-option" data-lang="english">English</div>
                                    <div class="audio-option" data-lang="hindi">Hindi</div>
                                    <div class="audio-option" data-lang="punjabi">Punjabi</div>
                                </div>
                            </div>
                        </div>

                        <div class="control-group">
                            <button class="btn ghost" id="muteBtn" disabled>Mute</button>
                            <button class="btn" id="reloadBtn" disabled>Reload Stream</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- M3U Editor Modal -->
    <div class="modal" id="m3uEditorModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">M3U Playlist Editor</div>
                <button class="close-modal" id="closeEditor">&times;</button>
            </div>
            <div class="modal-body">
                <textarea class="m3u-editor" id="m3uEditor" placeholder="#EXTM3U
#EXTINF:-1 tvg-id=&quot;channel1&quot; tvg-name=&quot;Channel Name&quot; tvg-logo=&quot;logo.png&quot; group-title=&quot;Entertainment&quot;,Channel Name
http://stream.url/stream.m3u8"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn ghost" id="loadFromEditor">Load from Editor</button>
                <button class="btn" id="exportM3U">Export M3U File</button>
                <button class="btn success" id="copyM3U">Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <!-- Copy Notification -->
    <div class="copy-notification" id="copyNotification">Copied to clipboard!</div>

    <script>
        // Real IPTV playlists
        const playlistSources = [
            'https://iptv-org.github.io/iptv/languages/hin.m3u',
            'https://iptv-org.github.io/iptv/languages/pan.m3u',
            'https://iptv-org.github.io/iptv/countries/in.m3u'
        ];

        let allChannels = [];
        let currentChannel = null;
        let compatibleMode = false;
        let isMuted = false;
        let hls = null;

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializePlayer();
            loadAllChannels();
        });

        // Initialize player
        function initializePlayer() {
            setupEventListeners();
            updateButtonStates();
        }

        // Load ALL channels from playlists
        async function loadAllChannels() {
            const channelList = document.getElementById('channelList');
            channelList.innerHTML = '<div class="placeholder loading">Loading channels from playlists...</div>';
            
            document.getElementById('playerStatus').textContent = 'Loading channels...';
            document.getElementById('playerStatus').className = 'status loading';

            try {
                allChannels = [];
                
                // Load each playlist separately
                for (const playlistUrl of playlistSources) {
                    try {
                        const response = await fetch(playlistUrl);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const text = await response.text();
                        const channels = parseM3U(text, playlistUrl);
                        allChannels = allChannels.concat(channels);
                    } catch (error) {
                        console.error('Failed to load playlist:', playlistUrl, error);
                    }
                }

                // Remove duplicates based on URL
                const uniqueChannels = [];
                const urlSet = new Set();
                
                allChannels.forEach(channel => {
                    if (!urlSet.has(channel.url)) {
                        urlSet.add(channel.url);
                        uniqueChannels.push(channel);
                    }
                });

                allChannels = uniqueChannels;
                renderChannelList(allChannels);
                
                document.getElementById('playerStatus').textContent = `Loaded ${allChannels.length} channels`;
                document.getElementById('playerStatus').className = 'status success';
                
            } catch (error) {
                console.error('Error loading channels:', error);
                channelList.innerHTML = '<div class="placeholder error">Failed to load channels</div>';
                document.getElementById('playerStatus').textContent = 'Error loading channels';
                document.getElementById('playerStatus').className = 'status error';
            }
        }

        // Parse M3U file content
        function parseM3U(text, sourceUrl) {
            const lines = text.split('\n');
            const channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    // Parse channel info
                    const nameMatch = line.split(',').slice(1).join(',').trim();
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    
                    currentChannel = {
                        name: nameMatch || 'Unknown Channel',
                        group: groupMatch ? groupMatch[1] : 'General',
                        url: '',
                        source: sourceUrl.split('/').pop(),
                        rawExtinf: line
                    };
                    
                    // Look for the next non-empty line that is not a comment (the URL)
                    for (let j = i + 1; j < lines.length; j++) {
                        const nextLine = lines[j].trim();
                        if (nextLine && !nextLine.startsWith('#')) {
                            currentChannel.url = nextLine;
                            channels.push(currentChannel);
                            break;
                        }
                    }
                }
            }

            return channels;
        }

        // Render channel list
        function renderChannelList(channels) {
            const channelList = document.getElementById('channelList');
            
            if (channels.length === 0) {
                channelList.innerHTML = '<div class="placeholder">No channels found</div>';
                return;
            }

            channelList.innerHTML = '';
            
            channels.forEach((channel) => {
                const channelItem = document.createElement('div');
                channelItem.className = 'channel-item';
                channelItem.innerHTML = `
                    <div class="channel-name">${channel.name}</div>
                    <div class="channel-group">${channel.group}</div>
                    <div class="stream-info">${getDomainFromUrl(channel.url)}</div>
                `;
                channelItem.onclick = () => selectChannel(channel);
                channelList.appendChild(channelItem);
            });
        }

        // Get domain from URL for display
        function getDomainFromUrl(url) {
            try {
                return new URL(url).hostname;
            } catch {
                return url.substring(0, 30) + '...';
            }
        }

        // Select and load channel
        function selectChannel(channel) {
            // Remove active class from all channels
            document.querySelectorAll('.channel-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // Add active class to selected channel
            event.currentTarget.classList.add('active');
            
            currentChannel = channel;
            loadChannelStream(channel);
        }

        // Load channel stream
        function loadChannelStream(channel) {
            document.getElementById('currentChannel').textContent = channel.name;
            document.getElementById('playerStatus').textContent = 'Loading stream...';
            document.getElementById('playerStatus').className = 'status loading';
            document.getElementById('streamInfo').textContent = `Source: ${channel.source} | ${getDomainFromUrl(channel.url)}`;
            
            document.getElementById('placeholder').style.display = 'none';
            const videoPlayer = document.getElementById('videoPlayer');
            videoPlayer.style.display = 'block';

            // Stop any existing HLS instance
            if (hls) {
                hls.destroy();
                hls = null;
            }

            let streamUrl = channel.url;

            // Apply compatible mode if enabled
            if (compatibleMode) {
                streamUrl = applyCompatibleMode(streamUrl);
                document.getElementById('playerStatus').textContent = 'Loading with compatible mode...';
            }

            // Update button URLs and enable copy button
            document.getElementById('externalBtn').dataset.url = streamUrl;
            document.getElementById('rawUrlBtn').dataset.url = channel.url;
            document.getElementById('copyStreamBtn').disabled = false;
            updateButtonStates();

            // Try to play the stream
            playStream(streamUrl, videoPlayer);
        }

        // Apply compatible mode modifications
        function applyCompatibleMode(url) {
            try {
                const urlObj = new URL(url);
                
                if (url.includes('.m3u8')) {
                    urlObj.searchParams.set('_compatible', '1');
                    urlObj.searchParams.set('_cache', '1');
                    urlObj.searchParams.set('_buffer', '5000');
                }
                
                return urlObj.toString();
            } catch {
                return url;
            }
        }

        // Play stream with proper error handling
        function playStream(url, videoElement) {
            videoElement.pause();
            videoElement.src = '';
            videoElement.load();

            if (url.includes('.m3u8')) {
                playHlsStream(url, videoElement);
            } else {
                playDirectStream(url, videoElement);
            }
        }

        // Play HLS stream
        function playHlsStream(url, videoElement) {
            if (window.Hls && Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90
                });
                
                hls.loadSource(url);
                hls.attachMedia(videoElement);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoElement.play().then(() => {
                        document.getElementById('playerStatus').textContent = 'Playing HLS Stream';
                        document.getElementById('playerStatus').className = 'status success';
                    }).catch(error => {
                        document.getElementById('playerStatus').textContent = 'HLS Ready - Click play';
                        document.getElementById('playerStatus').className = 'status';
                    });
                });
                
                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.error('HLS Error:', data);
                    if (data.fatal) {
                        document.getElementById('playerStatus').textContent = 'Stream Error - Try Compatible Mode';
                        document.getElementById('playerStatus').className = 'status error';
                        hls.startLoad();
                    }
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = url;
                videoElement.addEventListener('loadedmetadata', function() {
                    videoElement.play().then(() => {
                        document.getElementById('playerStatus').textContent = 'Playing HLS (Native)';
                        document.getElementById('playerStatus').className = 'status success';
                    }).catch(error => {
                        document.getElementById('playerStatus').textContent = 'HLS Ready - Click play';
                        document.getElementById('playerStatus').className = 'status';
                    });
                });
            } else {
                document.getElementById('playerStatus').textContent = 'HLS not supported - Try Compatible Mode';
                document.getElementById('playerStatus').className = 'status error';
            }
        }

        // Play direct stream
        function playDirectStream(url, videoElement) {
            videoElement.src = url;
            videoElement.addEventListener('loadeddata', function() {
                videoElement.play().then(() => {
                    document.getElementById('playerStatus').textContent = 'Playing Direct Stream';
                    document.getElementById('playerStatus').className = 'status success';
                }).catch(error => {
                    document.getElementById('playerStatus').textContent = 'Ready - Click play';
                    document.getElementById('playerStatus').className = 'status';
                });
            });
            
            videoElement.onerror = function() {
                document.getElementById('playerStatus').textContent = 'Stream Error - Try Compatible Mode';
                document.getElementById('playerStatus').className = 'status error';
            };
        }

        // Generate M3U content for current channel
        function generateCurrentChannelM3U() {
            if (!currentChannel) return '';
            
            return `#EXTM3U
${currentChannel.rawExtinf || `#EXTINF:-1 tvg-id="${currentChannel.name.replace(/\s+/g, '')}" tvg-name="${currentChannel.name}" tvg-logo="" group-title="${currentChannel.group}",${currentChannel.name}`}
${currentChannel.url}`;
        }

        // Generate complete M3U for all channels
        function generateCompleteM3U() {
            let m3uContent = '#EXTM3U\n';
            
            allChannels.forEach(channel => {
                m3uContent += `${channel.rawExtinf || `#EXTINF:-1 tvg-id="${channel.name.replace(/\s+/g, '')}" tvg-name="${channel.name}" tvg-logo="" group-title="${channel.group}",${channel.name}`}\n`;
                m3uContent += `${channel.url}\n`;
            });
            
            return m3uContent;
        }

        // Copy to clipboard with notification
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const notification = document.getElementById('copyNotification');
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert('Failed to copy to clipboard');
            });
        }

        // Setup event listeners
        function setupEventListeners() {
            // Search functionality
            document.getElementById('searchInput').addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                const filteredChannels = allChannels.filter(channel => 
                    channel.name.toLowerCase().includes(searchTerm) || 
                    channel.group.toLowerCase().includes(searchTerm)
                );
                renderChannelList(filteredChannels);
            });

            // Compatible mode toggle
            document.getElementById('incompatibleToggle').addEventListener('click', function() {
                compatibleMode = !compatibleMode;
                const toggleSwitch = this.querySelector('.toggle-switch');
                
                if (compatibleMode) {
                    toggleSwitch.classList.add('active');
                    document.getElementById('playerStatus').textContent = 'Compatible Mode ON';
                } else {
                    toggleSwitch.classList.remove('active');
                    document.getElementById('playerStatus').textContent = 'Compatible Mode OFF';
                }
                
                if (currentChannel) {
                    setTimeout(() => loadChannelStream(currentChannel), 500);
                }
            });

            // Audio menu
            document.getElementById('audioBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                document.getElementById('audioDropdown').classList.toggle('show');
            });

            // Audio options
            document.querySelectorAll('.audio-option').forEach(option => {
                option.addEventListener('click', function() {
                    const lang = this.getAttribute('data-lang');
                    document.getElementById('audioBtn').textContent = `Audio: ${this.textContent} ▾`;
                    document.getElementById('audioDropdown').classList.remove('show');
                    document.getElementById('playerStatus').textContent = `Audio: ${this.textContent}`;
                });
            });

            // Close dropdowns when clicking outside
            document.addEventListener('click', function() {
                document.getElementById('audioDropdown').classList.remove('show');
            });

            // Control buttons
            document.getElementById('externalBtn').addEventListener('click', function() {
                if (this.dataset.url) {
                    window.open(this.dataset.url, '_blank');
                }
            });

            document.getElementById('rawUrlBtn').addEventListener('click', function() {
                if (this.dataset.url) {
                    alert(`Stream URL:\n${this.dataset.url}`);
                }
            });

            document.getElementById('muteBtn').addEventListener('click', toggleMute);
            document.getElementById('reloadBtn').addEventListener('click', reloadStream);

            // Copy Stream URL button
            document.getElementById('copyStreamBtn').addEventListener('click', function() {
                if (currentChannel) {
                    const m3uContent = generateCurrentChannelM3U();
                    copyToClipboard(m3uContent);
                }
            });

            // M3U Editor functionality
            document.getElementById('editorBtn').addEventListener('click', function() {
                document.getElementById('m3uEditor').value = generateCompleteM3U();
                document.getElementById('m3uEditorModal').classList.add('show');
            });

            document.getElementById('closeEditor').addEventListener('click', function() {
                document.getElementById('m3uEditorModal').classList.remove('show');
            });

            document.getElementById('loadFromEditor').addEventListener('click', function() {
                const editorContent = document.getElementById('m3uEditor').value;
                try {
                    const channels = parseM3U(editorContent, 'editor');
                    allChannels = channels;
                    renderChannelList(allChannels);
                    document.getElementById('m3uEditorModal').classList.remove('show');
                    document.getElementById('playerStatus').textContent = `Loaded ${channels.length} channels from editor`;
                    document.getElementById('playerStatus').className = 'status success';
                } catch (error) {
                    alert('Error parsing M3U content: ' + error.message);
                }
            });

            document.getElementById('exportM3U').addEventListener('click', function() {
                const m3uContent = document.getElementById('m3uEditor').value;
                const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'playlist.m3u';
                a.click();
                URL.revokeObjectURL(url);
            });

            document.getElementById('copyM3U').addEventListener('click', function() {
                const m3uContent = document.getElementById('m3uEditor').value;
                copyToClipboard(m3uContent);
            });

            // Close modal when clicking outside
            document.getElementById('m3uEditorModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                }
            });

            // Video player events
            const videoPlayer = document.getElementById('videoPlayer');
            videoPlayer.addEventListener('loadstart', function() {
                document.getElementById('playerStatus').textContent = 'Loading stream...';
                document.getElementById('playerStatus').className = 'status loading';
            });

            videoPlayer.addEventListener('canplay', function() {
                document.getElementById('playerStatus').textContent = 'Ready to play';
                document.getElementById('playerStatus').className = 'status success';
            });
        }

        // Update button states
        function updateButtonStates() {
            const hasChannel = currentChannel !== null;
            document.getElementById('externalBtn').disabled = !hasChannel;
            document.getElementById('rawUrlBtn').disabled = !hasChannel;
            document.getElementById('muteBtn').disabled = !hasChannel;
            document.getElementById('reloadBtn').disabled = !hasChannel;
        }

        // Toggle mute
        function toggleMute() {
            const videoPlayer = document.getElementById('videoPlayer');
            isMuted = !isMuted;
            videoPlayer.muted = isMuted;
            document.getElementById('muteBtn').textContent = isMuted ? 'Unmute' : 'Mute';
        }

        // Reload stream
        function reloadStream() {
            if (currentChannel) {
                document.getElementById('playerStatus').textContent = 'Reloading stream...';
                document.getElementById('playerStatus').className = 'status loading';
                loadChannelStream(currentChannel);
            }
        }
    </script>
    
    <!-- HLS.js library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</body>
</html>
